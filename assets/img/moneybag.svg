<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 72" role="img" aria-label="Money-bag mascot waving">
  <defs>
    <linearGradient id="bagGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3ddc6d"/>
      <stop offset="1" stop-color="#1f9d4d"/>
    </linearGradient>
  </defs>
  <!-- backpack -->
  <rect x="5" y="32" width="11" height="20" rx="5.5" fill="#178038"/>
  <!-- legs -->
  <rect x="21" y="53" width="9" height="14" rx="4.5" fill="#1f9d4d"/>
  <rect x="34" y="53" width="9" height="14" rx="4.5" fill="#1f9d4d"/>
  <!-- waving arm -->
  <g>
    <animateTransform attributeName="transform" attributeType="XML" type="rotate"
      values="-20 47 38; 12 47 38; -20 47 38" dur="1.1s" repeatCount="indefinite"/>
    <line x1="47" y1="38" x2="57" y2="25" stroke="#1f9d4d" stroke-width="7" stroke-linecap="round"/>
    <circle cx="58" cy="23" r="5" fill="#3ddc6d"/>
  </g>
  <!-- body (money sack) -->
  <path d="M26 20 C16 24 14 38 16 48 C17 55 24 59 32 59 C40 59 47 55 48 48 C50 38 48 24 38 20 C34 18 30 18 26 20 Z" fill="url(#bagGrad)"/>
  <!-- gathered top + drawstring tie -->
  <path d="M25 16 C26 9 38 9 39 16 C35 13 29 13 25 16 Z" fill="#3ddc6d"/>
  <path d="M39 17 q7 -2 9 4" fill="none" stroke="#178038" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M25 17 q-7 -2 -9 4" fill="none" stroke="#178038" stroke-width="2.4" stroke-linecap="round"/>
  <rect x="24" y="15" width="16" height="6" rx="3" fill="#178038"/>
  <!-- Among Us visor -->
  <ellipse cx="32" cy="33" rx="12" ry="7.5" fill="#bfe9ff"/>
  <ellipse cx="32" cy="33" rx="12" ry="7.5" fill="none" stroke="#8fd3f4" stroke-width="2"/>
  <ellipse cx="37" cy="30.5" rx="2.6" ry="1.5" fill="#ffffff" opacity="0.85"/>
  <!-- dollar belly -->
  <text x="32" y="52" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#f6c945">$</text>
</svg>
